packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 11 bloqueia postinstall de dependencias por padrao (strictDepBuilds) e
# falha o install se algum script ficar sem revisao.
#
# Atencao a dois detalhes que quebram build em container limpo:
#   1. Em pnpm 11 a chave e `allowBuilds`. O antigo `onlyBuiltDependencies` foi
#      REMOVIDO e e ignorado em silencio.
#   2. `allowBuilds` e um MAPA de pacote -> booleano, nao uma lista.
#
# Localmente o erro nao aparece quando o binario ja esta no store; so em
# ambiente limpo (Docker/CI).
allowBuilds:
  esbuild: true
  '@tailwindcss/oxide': true
  sharp: true
